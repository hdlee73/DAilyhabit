name: Build & Release APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Set version
        run: |
          BASE="$(tr -d '[:space:]' < VERSION)"
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          # main 브랜치에서 VERSION 파일의 버전으로 아직 릴리스가 없으면 새 릴리스를 만든다
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" && "$GITHUB_REF" == "refs/heads/main" ]] \
             && ! gh release view "v${BASE}" >/dev/null 2>&1; then
            echo "VERSION_NAME=${BASE}" >> "$GITHUB_ENV"
            echo "RELEASE=true" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "RELEASE=true" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=${BASE}-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/DailyHabit-${VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: DailyHabit-${{ env.VERSION_NAME }}
          path: dist/*.apk

      - name: Publish GitHub Release
        if: env.RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          name: 데일리해빗 v${{ env.VERSION_NAME }}
          files: dist/*.apk
          body: |
            ## 데일리해빗 v${{ env.VERSION_NAME }}
            - 오늘의 복음 (매일미사) + 요일별 가정을 위한 기도
            - 앞으로 7일 구글 캘린더 일정
            - 할 일 관리
            - 매일 아침 9시 알림 (복음 · 가정 기도 · 오늘 일정)

            **설치:** 아래 `DailyHabit-*.apk`를 휴대폰에서 내려받아 설치하세요. (알 수 없는 앱 설치 허용 필요)
