name: Fetch reference pages
on:
  push:
    branches: [fetch-prayers]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p out/p
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36"
          for i in $(seq 1 230); do
            curl -sL --max-time 20 -A "$UA" "https://m.catholic.or.kr/web/prayer/?flag=3&ingId=$i" -o out/p/$i.html || true
          done
          ls out/p | wc -l
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f out
          git commit -m "fetched prayers [skip ci]" || true
          git push
