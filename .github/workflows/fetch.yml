name: Fetch reference pages
on:
  push:
    branches: [fetch-prayers]
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36"
          curl -sL -A "$UA" "https://www.vaticannews.va/ko/vatican-city/news/2025-11/gmg-seoul-2027.html" -o out/wyd_vn.html || true
          curl -sL -A "$UA" "https://m.catholic.or.kr/web/prayer/" -o out/prayer_list.html || true
          curl -sL -A "$UA" "https://m.catholic.or.kr/web/prayer/?flag=3&ingId=179" -o out/prayer_179.html || true
          for f in 1 2 3; do curl -sL -A "$UA" "https://m.catholic.or.kr/web/prayer/?flag=$f" -o out/prayer_flag$f.html || true; done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: pages
          path: out
